<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page introuvable | Biarritz Domiciliation</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            color: #222;
            padding: 1rem;
        }
        .error-wrap {
            text-align: center;
            max-width: 480px;
        }
        .error-code {
            font-size: clamp(6rem, 20vw, 10rem);
            font-weight: 800;
            line-height: 1;
            color: #0066cc;
            margin-bottom: 1rem;
        }
        .error-msg {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #555;
        }
        .home-link {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #0066cc;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .home-link:hover { background: #004999; }
    </style>
</head>
<body>
    <div class="error-wrap">
        <div class="error-code">404</div>
        <p class="error-msg">Cette page n'existe pas.</p>
        <a href="/" class="home-link">Retour à l'accueil</a>
    </div>
</body>
</html>
